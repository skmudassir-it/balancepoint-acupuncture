  <!-- Text -->
  <text x="82" y="48" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#1a3c34">BalancePoint</text>
  <text x="82" y="76" font-family="Georgia, serif" font-size="15" fill="#5a7a6e" letter-spacing="3">ACUPUNCTURE</text>
  <line x1="82" y1="84" x2="260" y2="84" stroke="url(#g)" stroke-width="1.5" opacity="0.5"/>
</svg>
